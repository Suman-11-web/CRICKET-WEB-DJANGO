version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: village_cricket_live
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: ../infrastructure/Dockerfile.backend
    restart: unless-stopped
    environment:
      DEBUG: "False"
      DB_ENGINE: postgres
      PG_NAME: village_cricket_live
      PG_USER: postgres
      PG_HOST: postgres
      PG_PORT: "5432"
      USE_REDIS: "True"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  celery:
    build:
      context: ../backend
      dockerfile: ../infrastructure/Dockerfile.backend
    command: celery -A config worker -l info
    restart: unless-stopped
    environment:
      DB_ENGINE: postgres
      PG_NAME: village_cricket_live
      PG_USER: postgres
      PG_HOST: postgres
      USE_REDIS: "True"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infrastructure/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
